@if (items.length === 0) {
  <p class="empty-message">Votre liste est vide.</p>
} @else {

  <p class="item-count">
    {{ items.length }} article{{ items.length > 1 ? 's' : '' }}
  </p>

  <ul class="shopping-list">
    @for (item of items; track $index) {
      <li>
        <span>{{ item }}</span>

        <button
          type="button"
          (click)="requestDelete($index)"
        >
          Supprimer
        </button>
      </li>
    }
  </ul>
}
